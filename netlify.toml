[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_MASTER_EMAIL,VITE_MASTER_KEY,VITE_STOCK_PIN,VITE_TOKEN_PIN,VITE_MASTER_PIN,VITE_MANAGER_PIN"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
