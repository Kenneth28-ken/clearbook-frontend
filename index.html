
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clear Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            user-select: none;
            /* Allow scrolling on body if needed for smaller screens */
            overflow-y: auto; 
        }
        /* Custom scrollbar for cart and lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        /* Hidden scrollbar helper */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            @page {
                size: 80mm auto;
                margin: 0mm;
            }
            body {
                margin: 0;
                padding: 0;
                width: 80mm;
                background-color: white;
            }
            /* Hide everything by default */
            body * {
                visibility: hidden;
            }
            /* Show the receipt content */
            #receipt-content, #receipt-content * {
                visibility: visible;
            }
            #receipt-content {
                position: fixed;
                left: 0;
                top: 0;
                width: 78mm !important; /* maximize width */
                padding: 1mm !important; /* minimal padding */
                margin: 0 !important;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 11px; /* Smaller font to fit 48 chars */
                line-height: 1.1;
                color: black;
                background: white;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                z-index: 9999;
            }
            /* Optimize typography for thermal printing */
            #receipt-content .text-4xl { font-size: 24px !important; font-weight: 900 !important; }
            #receipt-content .text-3xl { font-size: 20px !important; font-weight: 900 !important; }
            #receipt-content .text-2xl { font-size: 18px !important; font-weight: 900 !important; }
            #receipt-content .text-xl { font-size: 16px !important; font-weight: 900 !important; }
            #receipt-content .text-lg { font-size: 14px !important; font-weight: 900 !important; }
            #receipt-content .text-base { font-size: 12px !important; font-weight: 700 !important; }
            #receipt-content .text-sm { font-size: 11px !important; font-weight: 700 !important; }
            #receipt-content .text-xs { font-size: 10px !important; font-weight: 700 !important; }
            
            #receipt-content .font-black { font-weight: 900 !important; -webkit-text-stroke: 0.5px black; }
            #receipt-content .font-bold { font-weight: 700 !important; }
            
            /* Ensure black text */
            #receipt-content * {
                color: black !important;
            }
        }
    </style>
<script type="importmap">
{

  }
}
</script>
</head>

</body>
