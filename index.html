
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clear Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            user-select: none;
            /* Allow scrolling on body if needed for smaller screens */
            overflow-y: auto; 
        }
        /* Custom scrollbar for cart and lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        /* Hidden scrollbar helper */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            @page {
                size: 80mm auto;
                margin: 0mm;
            }
            body {
                margin: 0;
                padding: 0;
                width: 80mm;
                background-color: white;
            }
            /* Hide everything by default */
            body * {
                visibility: hidden;
                height: 0;
            }
            /* Show the receipt content */
            #receipt-content, #receipt-content * {
                visibility: visible;
                height: auto;
            }
            #receipt-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 72mm !important; /* Standard printable area for 80mm paper */
                margin: 0 auto !important;
                padding: 2mm !important;
                font-family: 'Courier New', Courier, monospace;
                font-size: 12px; /* Standard readable size */
                line-height: 1.2;
                color: black;
                background: white;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
                max-width: none !important;
            }
            
            /* Force black text and remove shadows */
            #receipt-content * {
                color: black !important;
                text-shadow: none !important;
                box-shadow: none !important;
            }

            /* Optimize typography for thermal printing */
            #receipt-content .text-2xl { font-size: 16px !important; font-weight: 900 !important; }
            #receipt-content .text-xl { font-size: 14px !important; font-weight: 800 !important; }
            #receipt-content .text-lg { font-size: 14px !important; font-weight: 700 !important; }
            #receipt-content .text-base { font-size: 12px !important; font-weight: 600 !important; }
            #receipt-content .text-sm { font-size: 12px !important; }
            #receipt-content .text-xs { font-size: 11px !important; }
            #receipt-content .text-3xl { font-size: 18px !important; font-weight: 900 !important; }
            
            /* Remove any borders that might look faint */
            #receipt-content .border-t-\[12px\] { border-top: none !important; }
            #receipt-content .rounded-b-2xl { border-radius: 0 !important; }
        }
    </style>
